name: Rebuild FFmpeg decoder AAR

# Recompile FFmpeg + le module ffmpeg-decoder-downmix et remplace
# app/libs/lib-decoder-ffmpeg-release.aar sur la branche lancée.
# À relancer uniquement après une modification du décodeur natif.
on:
  workflow_dispatch:
  push:
    paths:
      - "ffmpeg-decoder-downmix/**"
      - ".github/workflows/build-ffmpeg-aar.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: "29.0.14206865"
      FFMPEG_TAG: "n7.0.2"   # libavcodec 61.3.100, comme l'AAR d'origine
      MIN_API: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch FFmpeg source
        run: |
          git clone --depth 1 --branch "${FFMPEG_TAG}" https://github.com/FFmpeg/FFmpeg.git \
            ffmpeg-decoder-downmix/src/main/jni/ffmpeg

      - name: Build FFmpeg static libs (4 ABIs)
        run: |
          bash ffmpeg-decoder-downmix/src/main/jni/build_ffmpeg.sh \
            "$PWD/ffmpeg-decoder-downmix/src/main" "$NDK_PATH" linux-x86_64 "$MIN_API" \
            vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd

      - name: Build decoder AAR
        env:
          USE_LOCAL_FFMPEG_DECODER: "true"
        run: |
          export FFMPEG_SOURCE_DIR="$PWD/ffmpeg-decoder-downmix/src/main/jni/ffmpeg"
          export FFMPEG_BUILD_DIR="$FFMPEG_SOURCE_DIR/android-libs"
          chmod +x gradlew
          ./gradlew --no-daemon :ffmpeg-decoder-downmix:assembleRelease
          ls -la ffmpeg-decoder-downmix/build/outputs/aar/

      - name: Check AAR contents
        run: |
          AAR=ffmpeg-decoder-downmix/build/outputs/aar/ffmpeg-decoder-downmix-release.aar
          unzip -l "$AAR" | grep -E "jni/(arm64-v8a|armeabi-v7a|x86|x86_64)/libffmpegJNI.so"
          test "$(unzip -l "$AAR" | grep -c 'libffmpegJNI.so')" -eq 4

      - name: Replace prebuilt AAR and commit
        run: |
          cp ffmpeg-decoder-downmix/build/outputs/aar/ffmpeg-decoder-downmix-release.aar \
             app/libs/lib-decoder-ffmpeg-release.aar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/lib-decoder-ffmpeg-release.aar
          git commit -m "Rebuild lib-decoder-ffmpeg-release.aar (FFmpeg ${FFMPEG_TAG})"
          git push
