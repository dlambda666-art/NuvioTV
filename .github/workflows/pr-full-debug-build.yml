name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    env:
      # Nuvio stable 1.0.0 - official backend
      NUVIO_SUPABASE_URL: https://api.nuvio.tv
      NUVIO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
      NUVIO_SUPABASE_FALLBACK_URL: https://api-two.nuvioapp.space

      TV_LOGIN_WEB_BASE_URL: https://nuvio.tv/tv-login
      DEVICE_LOGIN_WEB_BASE_URL: https://nuvio.tv/link

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local.properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=${NUVIO_SUPABASE_URL}
          NUVIO_SUPABASE_ANON_KEY=${NUVIO_SUPABASE_ANON_KEY}
          NUVIO_SUPABASE_FALLBACK_URL=${NUVIO_SUPABASE_FALLBACK_URL}
          TV_LOGIN_WEB_BASE_URL=${TV_LOGIN_WEB_BASE_URL}
          DEVICE_LOGIN_WEB_BASE_URL=${DEVICE_LOGIN_WEB_BASE_URL}
          EOF

          echo "Supabase URL configured: ${NUVIO_SUPABASE_URL}"
          echo "Supabase fallback configured: ${NUVIO_SUPABASE_FALLBACK_URL}"
          echo "TV login URL configured: ${TV_LOGIN_WEB_BASE_URL}"
          echo "Device login URL configured: ${DEVICE_LOGIN_WEB_BASE_URL}"

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Test updater and build fullDebug APK
        run: |
          ./gradlew \
            :app:testFullDebugUnitTest \
            --tests 'com.nuvio.tv.updater.*' \
            :app:assembleFullDebug \
            --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          echo "=== Generated APK ==="
          find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
