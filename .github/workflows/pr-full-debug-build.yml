name: Build Full Debug / Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]

  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

permissions:
  contents: read

concurrency:
  group: full-build-${{ github.event.pull_request.number || github.ref }}-${{ inputs.build_type || 'debug' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Full ${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}
    runs-on: ubuntu-latest

    env:
      NUVIO_SUPABASE_URL: https://api.nuvio.tv
      NUVIO_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
      NUVIO_SUPABASE_FALLBACK_URL: https://api-two.nuvioapp.space
      TV_LOGIN_WEB_BASE_URL: https://nuvio.tv/tv-login
      DEVICE_LOGIN_WEB_BASE_URL: https://nuvio.tv/link
      # Clé TMDB de l'app (bandes-annonces, enrichissement TMDB). Sans elle,
      # BuildConfig.TMDB_API_KEY est vide et tous les appels TMDB de l'app échouent.
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local.properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=${NUVIO_SUPABASE_URL}
          NUVIO_SUPABASE_ANON_KEY=${NUVIO_SUPABASE_ANON_KEY}
          NUVIO_SUPABASE_FALLBACK_URL=${NUVIO_SUPABASE_FALLBACK_URL}
          TV_LOGIN_WEB_BASE_URL=${TV_LOGIN_WEB_BASE_URL}
          DEVICE_LOGIN_WEB_BASE_URL=${DEVICE_LOGIN_WEB_BASE_URL}
          TMDB_API_KEY=${TMDB_API_KEY}
          EOF
          if [ -z "${TMDB_API_KEY}" ]; then
            echo "::error::Secret TMDB_API_KEY manquant (Settings > Secrets and variables > Actions) : sans lui, bandes-annonces et TMDB ne marchent pas dans l'app."
            exit 1
          fi

      # The debug build type signs with the "release" signing config, so it
      # needs a keystore. Generate a throwaway one for CI debug builds.
      - name: Prepare CI signing config (debug)
        if: ${{ github.event_name == 'pull_request' || inputs.build_type == 'debug' }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build fullDebug
        if: ${{ github.event_name == 'pull_request' || inputs.build_type == 'debug' }}
        run: |
          ./gradlew \
            :app:testFullDebugUnitTest \
            --tests 'com.nuvio.tv.updater.*' \
            :app:assembleFullDebug \
            --stacktrace

      # Signature fixe : sans elle, chaque APK release aurait une signature
      # différente et Android refuserait la mise à jour par-dessus l'ancien.
      - name: Prepare release signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        env:
          NUVIO_KEYSTORE_BASE64: ${{ secrets.NUVIO_KEYSTORE_BASE64 }}
          NUVIO_KEYSTORE_PASSWORD: ${{ secrets.NUVIO_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$NUVIO_KEYSTORE_BASE64" ] || [ -z "$NUVIO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets NUVIO_KEYSTORE_BASE64 et/ou NUVIO_KEYSTORE_PASSWORD manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf '%s' "$NUVIO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuviotv-fr.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuviotv-fr.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=nuviotv-fr"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$NUVIO_KEYSTORE_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$NUVIO_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build fullRelease
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        run: |
          ./gradlew \
            :app:testFullReleaseUnitTest \
            --tests 'com.nuvio.tv.updater.*' \
            :app:assembleFullRelease \
            --stacktrace

      - name: Verify generated APKs
        shell: bash
        run: |
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}" == "true" ]]; then
            echo "=== Full Release APKs ==="
            find app/build/outputs/apk/full/release \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print
          else
            echo "=== Full Debug APKs ==="
            find app/build/outputs/apk/full/debug \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print
          fi

      - name: Upload Full Release APKs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-1.0.0-FR-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Full Debug APKs
        if: ${{ github.event_name == 'pull_request' || inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-1.0.0-FR-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
