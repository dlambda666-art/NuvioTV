name: Récupérer des images
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Une ligne par image : nom=url (séparées par des espaces)"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p downloaded-images
          for pair in $URLS; do
            name="${pair%%=*}"; url="${pair#*=}"
            curl -fsSL -A "Mozilla/5.0" -o "downloaded-images/$name" "$url" && echo "ok $name" || echo "::error::échec $name"
          done
          ls -la downloaded-images
      - name: Enregistrer
        run: |
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add downloaded-images
          git commit -m "Images téléchargées" || exit 0
          git push origin HEAD:refs/heads/assets-dl
