name: Récupérer des images
on:
  push:
    branches: [assets-dl]
    paths: [image-urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          mkdir -p downloaded-images
          for pair in $(cat image-urls.txt); do
            name="${pair%%=*}"; url="${pair#*=}"
            curl -fsSL -A "Mozilla/5.0" -o "downloaded-images/$name" "$url" && echo "ok $name" || echo "::error::échec $name"
          done
          ls -la downloaded-images
      - name: Enregistrer
        run: |
          git config user.email noreply@anthropic.com
          git config user.name Claude
          git add downloaded-images
          git commit -m "Images téléchargées" || exit 0
          git push origin HEAD:refs/heads/assets-dl
